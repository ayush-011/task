<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <link rel="stylesheet" href="style.css">
</head>

<body>
   <div class="container">
    <header class="header">
        <h1>Elegant Notes</h1>
        <p>Enter your thoughts and ideas</p>
    </header>

    <div class="controls">
        <div class="controlsContainer">
            <input type="text" id="searchInput" placeholder="Search..." class="serachInput"/>

            <div class="filterGroup">
                <select id="filterSelect">
                    <option class="all">All Notes</option>
                    <option class="work">Work</option>
                    <option class="personal">Personality</option>
                    <option class="ideas">Ideas</option>
                    <option class="reminders">Reminders</option>
                </select>
                <button id="addNoteBtn" class="addBtn">
                    <i class="ri-add-line"></i>ADD
                </button>
            </div>
        </div>
    </div>

    <div id="notesContainer" class="notesGrid">

    </div>

    <div class="emptyState">
        <i class="ri-sticky-note-line"></i>
        <h3>No Notes</h3>
        <p>Add yours first note by clicking the "ADD" button</p>
    </div>

    <div id="addNoteModal">
        <div class="modal">
            <div class="modalHeader">
                <h3 class="modalTitle">New Note</h3>
                <button id="closeModalBtn">
                    <i class="ri-keynote-line"></i>
                </button>
            </div>
        </div>
    </div>

   </div>
    <script src="script.js"></script>
</body>

</html>
